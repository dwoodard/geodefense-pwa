# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Publish PR previews immediately; do not wait for Playwright screenshots.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'build-loop/'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate PWA and wave HUD
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const html = fs.readFileSync('index.html', 'utf8')
          const worker = fs.readFileSync('sw.js', 'utf8')
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1]
          assert.ok(script, 'Game script is missing')
          new Function(script)
          new Function(worker)
          const version = html.match(/const APP_VERSION=(\d+)/)?.[1]
          assert.ok(version, 'Game version missing')
          assert.ok(worker.includes('v' + version + '-'), 'Service-worker version does not match game')
          const printed = []
          const ctx = new Proxy({
            fillText: s => printed.push(String(s)),
            measureText: s => ({ width: String(s).length * 7 })
          }, { get: (o, k) => k in o ? o[k] : () => {} })
          const canvas = { getContext: () => ctx, addEventListener: () => {}, width: 390, height: 740, style: {} }
          const document = { querySelector: () => canvas, addEventListener: () => {}, hidden: false }
          const store = { getItem: () => null, setItem: () => {}, removeItem: () => {} }
          const win = { visualViewport: null, addEventListener: () => {} }
          const loc = { pathname: '/geodefense-pwa/', reload: () => {} }
          const exercise = new Function('document', 'localStorage', 'sessionStorage', 'window', 'navigator', 'location',
            'addEventListener', 'requestAnimationFrame', 'setInterval', 'innerWidth', 'innerHeight', 'devicePixelRatio',
            script + `
              screen='game';phase='wave';wave=8;lives=20;money=350;enemies=[];towers=[];
              waveQueues=[6,7,8].map(w=>({wave:w,routeId:0,remaining:2,clock:100}));
              draw();update(1/60);draw();
            `)
          exercise(document, store, store, win, {}, loc, () => {}, () => {}, () => {}, 390, 740, 1)
          assert.ok(printed.includes('6 LEFT'), 'Compact enemy HUD regression')
          assert.ok(printed.includes('3 WAVES'), 'Overlapping wave HUD regression')
          assert.ok(!printed.some(s => s.includes('RELEASE TO MERGE') || s.includes('PATH SHIFT IN')), 'Old battlefield overlay returned')
          assert.ok(!printed.some(s => s.includes('function activeWaveCount')), 'Function text leaked to HUD')
          console.log(`Validated game v${version}, service worker, and wave rendering`)
          NODE
      - name: Assemble stable game and PR previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-loop-pages.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The root game always comes from main; previews live under /previews/pr-N/.
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published game version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EXPECTED=$(grep -oE 'const APP_VERSION=[0-9]+,APP_REVISION=[0-9]+' index.html | head -n 1)
          if [[ -z "$EXPECTED" ]]; then echo "Full game version missing"; exit 1; fi
          for i in $(seq 1 24); do
            PAGE=$(curl --location --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${PAGE_URL}index.html?verify=${GITHUB_SHA}" || true)
            PUBLISHED=$(printf '%s' "$PAGE" | grep -oE 'const APP_VERSION=[0-9]+,APP_REVISION=[0-9]+' | head -n 1)
            if [[ "$PUBLISHED" == "$EXPECTED" ]]; then
              echo "Verified deployed $EXPECTED at ${PAGE_URL}"
              exit 0
            fi
            echo "Waiting for $EXPECTED; published: ${PUBLISHED:-missing} (attempt $i/24)"
            sleep 5
          done
          echo "Published site did not serve $EXPECTED"
          exit 1
      - name: Verify PR preview is playable and current
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          EXPECTED=$(git show "origin/main:index.html" | grep -oE 'const APP_VERSION=[0-9]+,APP_REVISION=[0-9]+' | head -n 1)
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          PR_VERSION=$(git show FETCH_HEAD:index.html | grep -oE 'const APP_VERSION=[0-9]+,APP_REVISION=[0-9]+' | head -n 1)
          if [[ -z "$PR_VERSION" ]]; then echo "PR game version missing"; exit 1; fi
          for i in $(seq 1 24); do
            PAGE=$(curl --location --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${PAGE_URL}previews/pr-${PR_NUMBER}/?verify=${PR_HEAD}" || true)
            PUBLISHED=$(printf '%s' "$PAGE" | grep -oE 'const APP_VERSION=[0-9]+,APP_REVISION=[0-9]+' | head -n 1)
            if [[ "$PUBLISHED" == "$PR_VERSION" ]]; then
              echo "Verified playable preview: ${PAGE_URL}previews/pr-${PR_NUMBER}/ ($PR_VERSION)"
              echo "## Play preview" >> "$GITHUB_STEP_SUMMARY"
              echo "${PAGE_URL}previews/pr-${PR_NUMBER}/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for PR version $PR_VERSION; got ${PUBLISHED:-missing} ($i/24)"
            sleep 5
          done
          echo "PR preview did not serve expected version $PR_VERSION"
          exit 1
