name: Build Loop - Preview checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-loop-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax and version
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const html = fs.readFileSync('index.html', 'utf8')
          const sw = fs.readFileSync('sw.js', 'utf8')
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1]
          assert.ok(script, 'Game script missing')
          new Function(script)
          new Function(sw)
          const version = html.match(/const APP_VERSION=(\d+)/)?.[1]
          assert.ok(version, 'APP_VERSION missing')
          assert.ok(sw.includes('v' + version + '-'), 'Game/service-worker version mismatch')
          console.log('Validated Neon Defense v' + version)
          NODE
      - name: Install Playwright for browser screenshots
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser smoke test and capture screenshots
        run: node scripts/build-loop-screenshots.mjs
      - name: Save portrait and landscape screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-loop-screenshots-pr-${{ github.event.pull_request.number }}
          path: artifacts/build-loop/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Add preview references to Actions summary
        if: always()
        run: |
          echo "## Build Loop · PR #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots: download this run's screenshot artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- After the preview infrastructure is on main, successful runs publish: https://dwoodard.github.io/geodefense-pwa/previews/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production remains the main branch: https://dwoodard.github.io/geodefense-pwa/" >> "$GITHUB_STEP_SUMMARY"
